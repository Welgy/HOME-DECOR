<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар — УЮТНЫЙ ДОМ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* общие настройки */
        body {
            background-color: #f4f6f9;
        }

        .product-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* верхняя карточка */
        .product-card-top {
            display: flex;
            gap: 50px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        /* блок с фото */
        .product-image-block {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fdfdfd;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            height: 500px;
            width: 100%;
        }
        .product-image-block img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .product-image-block img:hover {
            transform: scale(1.05);
        }

        /* блок с информацией */
        .product-info-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-brand {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e6a117;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 28px;
            color: #1a1a1a;
            margin: 0 0 15px 0;
            line-height: 1.3;
            font-weight: 700;
        }

        .product-short-desc {
            color: #777;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* цена и кнопка */
        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 25px;
        }

        .price-current {
            font-size: 36px;
            font-weight: 800;
            color: #1a1a1a;
        }

        .price-old {
            font-size: 18px;
            color: #aaa;
            text-decoration: line-through;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        /* Стили для выбора размера */
                /* Стили для выбора размера (карточки) */
        .size-options {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .size-card {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: #fff;
            min-width: 100px;
        }
        .size-card:hover {
            border-color: #c5d5f5;
        }
        .size-card.active {
            border-color: #194693;
            background: #f0f4ff;
            box-shadow: 0 0 0 1px #194693;
        }
        .size-card .size-title {
            font-weight: bold;
            color: #333;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .size-card .size-price {
            font-size: 13px;
            color: #777;
        }
        .size-card.active .size-title,
        .size-card.active .size-price {
            color: #194693;
        }

        .btn-add-cart {
            background-color: #1a1a1a;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.3s;
        }
        .btn-add-cart:hover {
            background-color: #333;
        }

        .btn-add-fav {
            background-color: #1a1a1a;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add-fav:hover {
            background-color: #333;
        }

        /* блок описания и характеристик */
        .product-details {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .product-details h2 {
            font-size: 22px;
            color: #1a1a1a;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .product-description {
            color: #555;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
        }
        .specs-table tr {
            border-bottom: 1px dashed #eee;
            transition: background 0.2s;
        }
        .specs-table tr:hover {
            background-color: #fafafa;
        }
        .specs-table td {
            padding: 15px 10px;
            font-size: 15px;
            color: #555;
        }
        .specs-table td:first-child {
            color: #888;
            width: 40%;
        }
        .specs-table td:last-child {
            font-weight: 600;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <!-- шапка сайта -->
            <header class="site-header">
        <a href="index.html" class="logo">УЮТНЫЙ ДОМ</a>
        <div class="header-center">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="about.html">О компании</a>
                <a href="contacts.html">Контакты</a>
            </nav>
        </div>

                <div class="header-right">
            <a href="favorites.html" class="fav-link">
                <div class="cart-icon-wrapper">
                    <!-- Иконка сердечка -->
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span class="fav-count">0</span>
                </div>

            <a href="cart.html" class="cart-link" id="cart-icon">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>

                </div>
                <span style="margin-top: 5px;">Корзина</span>

        </div>
    </header>

    <div class="product-wrapper" id="product-page">
        <!-- Сюда JS вставит данные -->
    </div>

    <script src="products-data.js"></script>
    <script src="cart.js"></script>
    <script src="product.js"></script>
</body>
</html>
