<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — УЮТНЫЙ ДОМ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* стили страницы контактов */
        .contacts-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .contacts-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .contacts-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        .contacts-header p {
            color: #666;
            font-size: 16px;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* левая колонка с информацией */
        .contact-info h3 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .contact-item {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .contact-item svg {
            color: #194693;
            flex-shrink: 0;
            margin-top: 3px;
        }
        .contact-item-text strong {
            display: block;
            font-size: 15px;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .contact-item-text span {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
        }
        .contact-item-text a {
            color: #194693;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }
        .contact-item-text a:hover {
            text-decoration: underline;
        }

        /* правая колонка с картой */
        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f0f0;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 900px) {
            .contacts-grid {
                grid-template-columns: 1fr;
            }
            .map-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- шапка сайта -->
    <header class="site-header">
        <a href="index.html" class="logo">УЮТНЫЙ ДОМ</a>
        <div class="header-center">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="about.html">О компании</a>
                <a href="contacts.html" class="active">Контакты</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="favorites.html" class="fav-link">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    <span class="fav-count">0</span>
                </div>
                <span style="margin-top: 5px;">Избранное</span>
            </a>
            <a href="cart.html" class="cart-link" id="cart-icon">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span id="cart-count">0</span>
                </div>
                <span style="margin-top: 5px;">Корзина</span>
            </a>
        </div>
    </header>

    <!-- основа -->
    <div class="contacts-container">
        <div class="contacts-header">
            <h1>Наши контакты</h1>
            <p>Мы всегда рады помочь вам с выбором!</p>
        </div>

        <div class="contacts-grid">
            
            <!-- информация -->
            <div class="contact-info">
                <h3>Как с нами связаться</h3>
                
                                <div class="contact-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>

                    <div class="contact-item-text">

                    </div>
                </div>

                <div class="contact-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>

            </div>

            <!-- карта -->
            <div class="map-container">
                <iframe src="https://yandex.by/map-widget/v1/?ll=27.547036%2C53.878384&z=17&pt=27.547036,53.878384,pm2rdm" width="100%" height="100%" frameborder="0" allowfullscreen="true"></iframe>
