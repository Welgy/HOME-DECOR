<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — УЮТНЫЙ ДОМ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
            <header class="site-header">
        <a href="index.html" class="logo">Уютный Дом</a>
        <div class="header-center">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <nav class="main-nav">
                <a href="index.html">Каталог</a>
                <a href="about.html">О компании</a>
                <a href="contacts.html">Контакты</a>
            </nav>
        </div>
                <div class="header-right">
            <a href="favorites.html" class="fav-link">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span class="fav-count">0</span>
                </div>
                <span style="margin-top: 5px;">Избранное</span>
            </a>
            <a href="cart.html" class="cart-link" id="cart-icon">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count">0</span>
                </div>
                <span style="margin-top: 5px;">Корзина</span>
            </a>
        </div>
    </header>
    <div class="cart-page">
        <h1>Ваша корзина</h1>
        <div id="cart-items">
        </div>
        <div class="cart-summary" id="cart-summary" style="display: none;">
            <div class="cart-total">
                Итого: <span id="cart-total-price">0 руб</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Оформить заказ</button>
        </div>
        <div id="empty-cart-message" style="display: none; text-align: center; margin-top: 50px;">
            <h2>Ваша корзина пуста</h2>
            <a href="index.html" class="back-link">Вернуться в каталог</a>
        </div>
    </div>
    <script src="products-data.js"></script>
    <script src="cart.js"></script>
    <script src="cart-page.js"></script>
</body>
</html>
